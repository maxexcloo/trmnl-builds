# Development
[tasks.check]
depends = [
  "check:actions",
  "check:mise",
  "check:oxfmt",
  "check:python",
  "check:site",
  "check:updates",
  "check:whitespace",
  "test:python",
]

[tasks."check:site"]
run = "sed -n '/<script type=\"module\">/,/<\\/script>/{//!p}' site/index.html | node --check --input-type=module"
