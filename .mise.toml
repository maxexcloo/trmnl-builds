[env]
# Lets the Renovate CLI re-vendor ESP Web Tools after bumping its pin.
RENOVATE_ALLOWED_COMMANDS = '["^scripts/vendor_esp_web_tools\\.sh$"]'

# Development
[tasks.check]
depends = [
  "check:actions",
  "check:mise",
  "check:oxfmt",
  "check:python",
  "check:shell",
  "check:updates",
  "check:whitespace",
  "test:python",
]
run = '''
node -e '
const { execFileSync } = require("node:child_process");
const { readFileSync } = require("node:fs");
const html = readFileSync("site/index.html", "utf8");
const script = html.match(/<script type="module">([\s\S]*?)<\/script>/)[1];
execFileSync("node", ["--check", "--input-type=module"], { input: script, stdio: ["pipe", "inherit", "inherit"] });
'
'''

[tasks.fmt]
depends = ["fmt:mise", "fmt:oxfmt", "fmt:python"]
