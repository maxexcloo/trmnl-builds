[tools]
# gh = "latest"
# node = "latest"
# updatecli = "latest"
# uv = "latest"
actionlint = "1.7.12"
shellcheck = "0.11.0"

# Dependency Updates
[tasks."dependencies:check"]
description = "Preview Local Dependency Updates"
run = """
GITHUB_TOKEN="$(gh auth token)"
export GITHUB_TOKEN
updatecli pipeline diff --config .updatecli.d --disable-changelog --disable-udash-report --unique-tmp-dir
"""

[tasks."dependencies:update"]
description = "Apply Reviewed Local Dependency Updates"
usage = 'flag "--labels <labels>" help="Select Updatecli groups, such as group:tools"'
run = """
GITHUB_TOKEN="$(gh auth token)"
export GITHUB_TOKEN
set --
if [ -n "${usage_labels:-}" ]; then
  set -- --labels "$usage_labels"
fi
updatecli pipeline apply --config .updatecli.d --disable-changelog --disable-udash-report --unique-tmp-dir "$@"
"""

# Development
[tasks.check]
description = "Validate Configuration, Site JavaScript & Firmware Tests"
run = '''
updatecli manifest validate --config .updatecli.d --disable-templating --strict
# Native concurrency queues are supported by GitHub but not actionlint 1.7.12.
actionlint -ignore unexpected.key..queue..for..concurrency..section
uv run --locked python -c 'import pathlib, re, subprocess; script = re.search(r"<script type=\"module\">(.*?)</script>", pathlib.Path("site/index.html").read_text(), re.S)[1]; subprocess.run(["node", "--check", "--input-type=module"], check=True, input=script, text=True)'
uv run --locked python -m unittest discover -s tests
'''
