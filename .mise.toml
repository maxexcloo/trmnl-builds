[tools]
# The published shared CI configuration does not yet activate Oxfmt.
oxfmt = "0.73.0"

[vars]
# Native concurrency queues are not recognised by the shared Actionlint version.
actionlint_args = "-ignore unexpected.key..queue..for..concurrency..section"
python_test_runner = "uv run --locked python -B"

# Development
[tasks.check]
depends = ["check:actions", "check:oxfmt", "check:python", "check:updates", "test:python"]
run = '''
uv run --locked python - <<'PY'
import pathlib
import re
import subprocess

html = pathlib.Path("site/index.html").read_text()
script = re.search(r'<script type="module">(.*?)</script>', html, re.S)[1]
subprocess.run(
    ["node", "--check", "--input-type=module"],
    check=True,
    input=script,
    text=True,
)
PY
'''

[tasks."check:oxfmt"]
run = "oxfmt --check --no-error-on-unmatched-pattern ."

[tasks.fmt]
depends = ["fmt:oxfmt", "fmt:python"]

[tasks."fmt:oxfmt"]
run = "oxfmt --write --no-error-on-unmatched-pattern ."
