[vars]
# Native concurrency queues are not recognised by the shared Actionlint version.
actionlint_args = "-ignore unexpected.key..queue..for..concurrency..section"
python_test_runner = "uv run --locked python -B"

# Development
[tasks.check]
depends = ["check:actions", "check:updates", "test:python"]
run = "uv run --locked python -c 'import pathlib, re, subprocess; script = re.search(r\"<script type=\\\"module\\\">(.*?)</script>\", pathlib.Path(\"site/index.html\").read_text(), re.S)[1]; subprocess.run([\"node\", \"--check\", \"--input-type=module\"], check=True, input=script, text=True)'"
