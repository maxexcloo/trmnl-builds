[project]
name = "trmnl-builds"
requires-python = ">=3.13"
version = "0.0.0"
dependencies = [
  "esptool",
  # Upstream tool installers invoke python -m pip.
  "pip",
  # Upstream's older platforms break Core 6.2.0's SCons: pioarduino/platform-espressif32#529.
  "platformio!=6.2.0",
]

[tool.uv]
package = false
