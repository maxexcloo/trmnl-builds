[project]
name = "trmnl-builds"
# Upstream PlatformIO and ESP-IDF builds are verified on Python 3.13 only.
requires-python = ">=3.13,<3.14"
version = "0.0.0"
dependencies = [
  "esptool",
  # Upstream tool installers invoke python -m pip.
  "pip",
  # 6.2.0 breaks upstream ESP-IDF builds: pioarduino/platform-espressif32#529.
  "platformio!=6.2.0",
]

[tool.uv]
package = false
