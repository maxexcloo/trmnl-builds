# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Mise Tools
pipelineid: update-mise-tools
labels:
  group: tools
targets:
  tools:
    disablesourceinput: true
    kind: shell
    spec:
      command: |
        updates=$(mise outdated --bump --json --local) || exit "$?"
        if [ "$updates" = "{}" ]; then
          exit 0
        fi
        if [ "$DRY_RUN" = false ]; then
          mise upgrade --bump --local --no-prune || exit "$?"
        fi
        printf '%s\n' "$updates"
---
name: Update Required uv Version
pipelineid: update-required-uv-version
labels:
  group: tools
sources:
  version:
    kind: githubrelease
    spec:
      owner: astral-sh
      repository: uv
      token: '{{ env "GITHUB_TOKEN" }}'
      versionfilter:
        kind: semver
        pattern: "*"
    transformers:
      - trimprefix: v
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: pyproject.toml
      matchpattern: (required-version = "==)[0-9.]+(")
      replacepattern: ${1}{{ source "version" }}${2}
