# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Actions
pipelineid: update-actions
labels:
  group: actions
autodiscovery:
  crawlers:
    github/action:
      digest: false
      rootdir: .github
      ignore:
        - actions:
            astral-sh/setup-uv: ""
      versionfilter:
        kind: regex/semver
        pattern: "*"
        regex: ^v?([0-9]+)$
---
name: Update Versioned Actions
pipelineid: update-versioned-actions
labels:
  group: actions
autodiscovery:
  crawlers:
    github/action:
      digest: false
      rootdir: .github
      only:
        - actions:
            astral-sh/setup-uv: ""
