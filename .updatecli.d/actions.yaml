# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Major Action Aliases
pipelineid: update-major-action-aliases
labels:
  group: actions
autodiscovery:
  crawlers:
    github/action:
      digest: false
      credentials:
        github.com:
          kind: github
          token: '{{ env "GITHUB_TOKEN" }}'
      ignore:
        - actions:
            astral-sh/setup-uv: ""
      versionfilter:
        kind: regex/semver
        pattern: "*"
        regex: ^v?([0-9]+)$
---
name: Update Versioned Actions
pipelineid: update-versioned-actions
labels:
  group: actions
autodiscovery:
  crawlers:
    github/action:
      digest: false
      credentials:
        github.com:
          kind: github
          token: '{{ env "GITHUB_TOKEN" }}'
      only:
        - actions:
            astral-sh/setup-uv: ""
