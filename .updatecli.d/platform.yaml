# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Patched PlatformIO Platforms
pipelineid: update-patched-platformio-platforms
labels:
  group: platform
sources:
  version:
    kind: githubrelease
    spec:
      owner: pioarduino
      repository: platform-espressif32
      token: '{{ env "GITHUB_TOKEN" }}'
      # Stay on the reviewed 55.x (ESP-IDF 5.5) line; bump majors manually. Release order
      # keeps -N fix releases, which semver would treat as prereleases.
      versionfilter:
        kind: regex
        pattern: ^55\.[0-9]{2}\.[0-9]+(?:-[0-9]+)?$
targets:
  patches:
    kind: file
    sourceid: version
    spec:
      file: patches/*/*.patch
      matchpattern: (\n\+platform = https://github.com/pioarduino/platform-espressif32/releases/download/)[^/\s]+/platform-espressif32.zip
      replacepattern: ${1}{{ source "version" }}/platform-espressif32.zip
      searchpattern: true
