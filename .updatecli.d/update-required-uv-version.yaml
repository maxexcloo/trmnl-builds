# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update Required uv Version
pipelineid: update-required-uv-version
labels:
  group: tools
sources:
  version:
    kind: githubrelease
    spec:
      owner: astral-sh
      repository: uv
      token: '{{ env "GITHUB_TOKEN" }}'
      versionfilter:
        kind: semver
        pattern: "*"
    transformers:
      - trimprefix: v
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: pyproject.toml
      matchpattern: (required-version = "==)[0-9.]+(")
      replacepattern: ${1}{{ source "version" }}${2}
