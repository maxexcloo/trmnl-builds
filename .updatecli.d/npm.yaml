# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update ESP Web Tools
pipelineid: update-esp-web-tools
labels:
  group: npm
sources:
  version:
    kind: npm
    spec:
      name: esp-web-tools
targets:
  pin:
    kind: file
    sourceid: version
    spec:
      file: site/index.html
      matchpattern: (https://unpkg.com/esp-web-tools@)[^/\s"]+
      replacepattern: ${1}{{ source "version" }}
