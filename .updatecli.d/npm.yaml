# yaml-language-server: $schema=https://www.updatecli.io/schema/latest/policy/manifest/config.json
name: Update ESP Web Tools
pipelineid: update-esp-web-tools
labels:
  group: npm
sources:
  version:
    kind: npm
    spec:
      name: esp-web-tools
targets:
  vendor:
    kind: shell
    sourceid: version
    spec:
      # Updatecli appends the source version; printed output reports a change.
      command: |-
        set -eu
        vendor() {
          directory=site/vendor/esp-web-tools
          current=$(node -p "require('./$directory/package.json').version")
          test "$current" != "$1" || return 0
          echo "$1"
          test "$DRY_RUN" = false || return 0
          download=$(mktemp -d)
          npm pack --silent --pack-destination "$download" "esp-web-tools@$1" >/dev/null
          tar -xzf "$download"/*.tgz -C "$download"
          rm -rf "$directory"
          mkdir -p "$directory"
          cp "$download"/package/LICENSE "$download"/package/package.json "$download"/package/dist/web/*.js "$directory"
          rm -rf "$download"
        }
        vendor
