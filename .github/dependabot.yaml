version: 2
updates:
  - directory: /
    package-ecosystem: github-actions
    groups:
      actions:
        patterns: ["*"]
    schedule:
      interval: monthly
  - directory: /
    package-ecosystem: uv
    groups:
      build-tools:
        patterns: ["*"]
    # Confirmed Paper S3 build failure: pioarduino/platform-espressif32#529.
    ignore:
      - dependency-name: platformio
        versions: ["6.2.0"]
    schedule:
      interval: monthly
