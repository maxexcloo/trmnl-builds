name: Firmware
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Published upstream release tag (blank checks for new releases)
        type: string
permissions:
  contents: read
concurrency:
  cancel-in-progress: false
  group: firmware
jobs:
  discover:
    name: Discover
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Find the Next Release
        id: plan
        run: python .github/scripts/firmware.py plan "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
      - name: Checkout Upstream
        if: steps.plan.outputs.tag != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: upstream
          persist-credentials: false
          ref: refs/tags/${{ steps.plan.outputs.tag }}
          repository: usetrmnl/trmnl-firmware
          submodules: recursive
      - name: Record Source
        id: source
        if: steps.plan.outputs.tag != ''
        run: |
          echo "sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          tar --exclude=.git -czf upstream-source.tar.gz -C upstream .
      - name: Set Up Python & uv
        if: steps.plan.outputs.tag != ''
        uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true
          python-version: "3.13"
      - name: Discover Firmware Targets
        id: targets
        if: steps.plan.outputs.tag != ''
        env:
          INCLUDE_GIT_HASH_IN_VERSION_NUMBER: "false"
        run: |
          uv sync --locked
          pio project config --project-dir upstream --json-output > config.json
          python .github/scripts/firmware.py discover config.json
      - name: Upload Source
        if: steps.plan.outputs.tag != ''
        uses: actions/upload-artifact@v7
        with:
          name: source
          path: upstream-source.tar.gz
          retention-days: 1
  build:
    name: Build ${{ matrix.target }}
    if: needs.discover.outputs.tag != ''
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        target: ${{ fromJSON(needs.discover.outputs.targets) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout Upstream
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: upstream
          persist-credentials: false
          ref: ${{ needs.discover.outputs.sha }}
          repository: usetrmnl/trmnl-firmware
          submodules: recursive
      - name: Set Up Python & uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true
          python-version: "3.13"
      - name: Install Dependencies
        run: uv sync --locked
      - name: Build Firmware
        id: build
        working-directory: upstream
        run: pio run -e "$TARGET"
        env:
          INCLUDE_GIT_HASH_IN_VERSION_NUMBER: "false"
          TARGET: ${{ matrix.target }}
      - name: Collect Result
        if: always()
        run: python .github/scripts/firmware.py pack "$TARGET" "$OUTCOME"
        env:
          OUTCOME: ${{ steps.build.outcome }}
          TARGET: ${{ matrix.target }}
      - name: Upload Firmware
        if: always()
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: firmware-${{ matrix.target }}
          path: results/
          retention-days: 1
  publish:
    name: Publish
    if: always() && !cancelled() && needs.discover.result == 'success' && needs.discover.outputs.tag != ''
    needs: [discover, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download Firmware
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: results
          pattern: firmware-*
      - name: Download Source
        uses: actions/download-artifact@v8
        with:
          name: source
      - name: Prepare Release Manifest
        run: python .github/scripts/firmware.py manifest "$TAG" "$SHA" "$TARGETS"
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.discover.outputs.sha }}
          TAG: ${{ needs.discover.outputs.tag }}
          TARGETS: ${{ needs.discover.outputs.targets }}
      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          preserve_order: true
          tag_name: ${{ needs.discover.outputs.tag }}
          target_commitish: main
          files: |
            upstream-source.tar.gz
            results/*/*.bin
            manifest.json
  pages:
    name: Pages
    if: always() && !cancelled() && needs.publish.result == 'success'
    needs: [discover, build, publish]
    uses: ./.github/workflows/pages.yaml
    permissions:
      contents: read
      id-token: write
      pages: write
