name: Firmware
run-name: Firmware · ${{ inputs.tag || 'New Releases' }}

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Published upstream release tag (blank checks for new releases)
        type: string

permissions:
  contents: read

concurrency:
  cancel-in-progress: false
  group: firmware
  queue: max

env:
  INCLUDE_GIT_HASH_IN_VERSION_NUMBER: "false"

jobs:
  discover:
    name: Discover
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.targets.outputs.builds }}
      latest: ${{ steps.plan.outputs.latest }}
      repository: ${{ steps.plan.outputs.repository }}
      sha: ${{ steps.source.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: plan
        name: Find the Next Release
        run: python3 .github/scripts/firmware.py plan "$TAG"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
      - if: steps.plan.outputs.tag != ''
        name: Checkout Upstream
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: upstream
          persist-credentials: false
          ref: refs/tags/${{ steps.plan.outputs.tag }}
          repository: ${{ steps.plan.outputs.repository }}
          submodules: recursive
      - id: source
        if: steps.plan.outputs.tag != ''
        name: Archive Upstream Source
        run: |
          echo "sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          tar -C upstream -czf upstream-source.tar.gz --exclude=.git .
      - if: steps.plan.outputs.tag != ''
        name: Set Up Python & uv
        uses: astral-sh/setup-uv@main
        with:
          activate-environment: true
      - id: targets
        if: steps.plan.outputs.tag != ''
        name: Discover Firmware Targets
        run: |
          uv sync --locked
          pio project config --json-output --project-dir upstream > config.json
          python .github/scripts/firmware.py discover config.json
      - if: steps.plan.outputs.tag != ''
        name: Upload Source
        uses: actions/upload-artifact@v7
        with:
          name: source
          overwrite: true
          path: upstream-source.tar.gz
          retention-days: 1

  build:
    if: needs.discover.outputs.tag != ''
    name: Build ${{ matrix.name }}
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Checkout Upstream
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: upstream
          persist-credentials: false
          ref: ${{ needs.discover.outputs.sha }}
          repository: ${{ needs.discover.outputs.repository }}
          submodules: recursive
      - if: matrix.patched
        name: Prepare Patched Variant
        env:
          NAME: ${{ matrix.name }}
          TARGET: ${{ matrix.target }}
        run: |
          git -C upstream apply "$PWD/patches/$TARGET"/*.patch
          mkdir -p "results/$NAME"
          tar -C upstream -czf "results/$NAME/$NAME-source.tar.gz" --exclude=.git .
      - name: Set Up Python & uv
        uses: astral-sh/setup-uv@main
        with:
          activate-environment: true
      - name: Install Dependencies
        run: uv sync --locked
      - id: build
        name: Build Firmware
        run: pio run -e "$TARGET"
        working-directory: upstream
        env:
          TARGET: ${{ matrix.target }}
      - if: always()
        name: Collect Result
        run: python .github/scripts/firmware.py pack "$TARGET" "$OUTCOME" "$NAME"
        env:
          NAME: ${{ matrix.name }}
          OUTCOME: ${{ steps.build.outcome }}
          TARGET: ${{ matrix.target }}
      - if: always()
        name: Upload Firmware
        uses: actions/upload-artifact@v7
        with:
          if-no-files-found: error
          name: firmware-${{ matrix.name }}
          overwrite: true
          path: results/
          retention-days: 1
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.builds) }}

  publish:
    if: always() && !cancelled() && github.ref == 'refs/heads/main' && needs.discover.result == 'success' && needs.discover.outputs.tag != ''
    name: Publish
    runs-on: ubuntu-latest
    needs: [discover, build]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download Firmware
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: results
          pattern: firmware-*
      - name: Download Source
        uses: actions/download-artifact@v8
        with:
          name: source
      - name: Prepare Release Manifest
        run: python3 .github/scripts/firmware.py manifest "$TAG" "$SHA" "$TARGETS"
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.discover.outputs.sha }}
          TAG: ${{ needs.discover.outputs.tag }}
          TARGETS: ${{ needs.discover.outputs.targets }}
      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          make_latest: ${{ needs.discover.outputs.latest }}
          preserve_order: true
          tag_name: ${{ needs.discover.outputs.tag }}
          target_commitish: main
          files: |
            upstream-source.tar.gz
            results/*/*.bin
            results/*/*-source.tar.gz
            manifest.json

  pages:
    if: always() && !cancelled() && needs.publish.result == 'success'
    name: Pages
    needs: publish
    uses: ./.github/workflows/pages.yaml
    permissions:
      contents: read
      id-token: write
      pages: write
