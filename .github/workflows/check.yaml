name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  cancel-in-progress: true
  group: check-${{ github.ref }}
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Tools
        uses: jdx/mise-action@v5
      - name: Test Release Planning & Packaging
        run: mise run check
      - name: Check Browser JavaScript
        run: |
          python3 - <<'PYCODE' > /tmp/site.mjs
          import pathlib, re
          html = pathlib.Path('site/index.html').read_text()
          print(re.search(r'<script type="module">(.*?)</script>', html, re.S)[1])
          PYCODE
          node --check /tmp/site.mjs
      - name: Validate Workflows
        # Native concurrency queues are supported by GitHub but not actionlint 1.7.12.
        run: actionlint -ignore unexpected.key..queue..for..concurrency..section
