name: Check
on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  cancel-in-progress: true
  group: check-${{ github.ref }}
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Shared Tools & Tasks
        uses: maxexcloo/dotfiles/.github/actions/mise@main
        with:
          tools: actionlint node oxfmt ruff updatecli uv
      - name: Run Checks
        run: mise run check
