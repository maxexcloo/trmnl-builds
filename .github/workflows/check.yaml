name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  cancel-in-progress: true
  group: check-${{ github.ref }}
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Python & uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true
          python-version: "3.13"
      - name: Install Dependencies
        run: uv sync --locked
      - name: Test Release Planning & Packaging
        run: python3 -m unittest discover -s tests
      - name: Check Browser JavaScript
        run: |
          python3 - <<'PYCODE' > /tmp/site.mjs
          import pathlib, re
          html = pathlib.Path('site/index.html').read_text()
          print(re.search(r'<script type="module">(.*?)</script>', html, re.S)[1])
          PYCODE
          node --check /tmp/site.mjs
      - name: Validate Workflows
        uses: docker://rhysd/actionlint:1.7.12
