name: Check
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  cancel-in-progress: true
  group: check-${{ github.ref }}
jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Configure Global Tools
        run: |
          mkdir -p "$HOME/.config/mise"
          sed -n '/^\[tools\]$/p; s/^# \([^ ]* = "latest"\)$/\1/p' .mise.toml > "$HOME/.config/mise/config.toml"
      - name: Set Up Tools
        uses: jdx/mise-action@v5
      - name: Run Checks
        run: mise run check
