name: Pages
on:
  push:
    branches: [main]
    paths:
      [".github/scripts/firmware.py", ".github/workflows/pages.yaml", "site/**"]
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  pages: write
concurrency:
  cancel-in-progress: false
  group: pages
  queue: max
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: main
      - name: Generate Catalogue
        run: python .github/scripts/firmware.py catalogue
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
