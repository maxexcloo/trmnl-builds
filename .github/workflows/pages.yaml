name: Pages
on:
  push:
    branches: [main]
    paths: ['.github/workflows/pages.yaml', 'scripts/firmware.py', 'site/**']
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
  pages: write
concurrency:
  cancel-in-progress: false
  group: pages
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: main
      - name: Generate Catalogue
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/firmware.py catalogue
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy Pages
        uses: actions/deploy-pages@v5
        id: deployment
