name: Validate Dependency Update
on:
  push:
    branches: [dependabot/uv/build-tools-03de1ad903]
permissions:
  contents: read
jobs:
  validate:
    name: Validate Paper S3
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set Up Python & uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true
          python-version: '3.13'
      - name: Update Starlette
        run: |
          uv lock --upgrade-package starlette
          uv sync --locked
          python -c "from importlib.metadata import version; print('Starlette:', version('starlette'))"
      - name: Upload Lockfile
        uses: actions/upload-artifact@v7
        with:
          name: updated-lockfile
          path: uv.lock
          retention-days: 1
      - name: Run Tests
        run: python -m unittest discover -s tests
      - name: Checkout Upstream
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: upstream
          persist-credentials: false
          ref: 9acd348270a493ca5f1c627ac91a9469543267ae
          repository: usetrmnl/trmnl-firmware
          submodules: recursive
      - name: Discover Targets
        env:
          INCLUDE_GIT_HASH_IN_VERSION_NUMBER: 'false'
        run: |
          pio project config --project-dir upstream --json-output > config.json
          python scripts/firmware.py discover config.json
      - name: Build Paper S3
        working-directory: upstream
        env:
          INCLUDE_GIT_HASH_IN_VERSION_NUMBER: 'false'
        run: pio run -e TRMNL_X_PAPERS3
      - name: Validate Firmware Packaging
        run: |
          python scripts/firmware.py pack TRMNL_X_PAPERS3 success
          python - <<'PYCODE'
          import json
          from pathlib import Path
          result = json.loads(Path('results/TRMNL_X_PAPERS3/result.json').read_text())
          assert result['flash']['chipFamily'] == 'ESP32-S3', result
          assert result['status'] == 'success', result
          print(json.dumps(result, indent=2))
          PYCODE
