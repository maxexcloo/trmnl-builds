name: Validate uv migration
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  paper:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          activate-environment: true
          python-version: '3.13'
      - run: uv sync --locked
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: upstream
          persist-credentials: false
          ref: 9acd348270a493ca5f1c627ac91a9469543267ae
          repository: usetrmnl/trmnl-firmware
          submodules: recursive
      - name: Build Paper S3 using the uv environment
        working-directory: upstream
        env:
          INCLUDE_GIT_HASH_IN_VERSION_NUMBER: 'false'
        run: pio run -e TRMNL_X_PAPERS3
      - name: Verify packaging with uv-managed esptool
        run: |
          python scripts/firmware.py pack TRMNL_X_PAPERS3 success
          python - <<'PYCODE'
          import json
          from pathlib import Path
          result = json.loads(Path('results/TRMNL_X_PAPERS3/result.json').read_text())
          assert result['flash']['chipFamily'] == 'ESP32-S3'
          assert len(result['files']) == 2
          PYCODE
  publish:
    needs: paper
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          merge-multiple: true
          path: results
          pattern: firmware-*
          run-id: 37525220250
      - uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          name: source
          run-id: 37525220250
      - name: Recreate metadata from the original build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v1.8.17 --repo "$GITHUB_REPOSITORY" --pattern manifest.json --dir previous
          python - <<'PYCODE'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import firmware
          previous = json.loads(Path('previous/manifest.json').read_text())
          os.environ['GITHUB_RUN_ID'] = previous['run'].rsplit('/', 1)[-1]
          firmware.manifest(previous['tag'], previous['commit'], json.dumps([item['target'] for item in previous['targets']]))
          PYCODE
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          preserve_order: true
          tag_name: v1.8.17
          target_commitish: main
          files: |
            upstream-source.tar.gz
            results/*/*.bin
            manifest.json
  pages:
    needs: publish
    uses: ./.github/workflows/pages.yaml
    permissions:
      contents: read
      id-token: write
      pages: write
